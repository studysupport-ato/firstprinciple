<polyline points="40.0,210.0 420.0,210.0" fill="none" stroke="#111111" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="240.0" y1="60.0" x2="240.0" y2="115.0" stroke="#111111" stroke-width="2.0" stroke-linecap="round"/>
<line x1="240.0" y1="155.0" x2="240.0" y2="210.0" stroke="#111111" stroke-width="2.0" stroke-linecap="round"/>
<rect x="-20.0" y="-7.5" width="40" height="15" fill="#fff" stroke="#111111" stroke-width="2.0" transform="translate(240.0,135.0) rotate(90.0)"/>
<text x="257.0" y="135.0" font-size="15" text-anchor="start" dominant-baseline="middle" fill="#111111">20 Ω</text>
<line x1="330.0" y1="60.0" x2="330.0" y2="115.0" stroke="#111111" stroke-width="2.0" stroke-linecap="round"/>
