<text x="347.0" y="135.0" font-size="15" text-anchor="start" dominant-baseline="middle" fill="#111111">20 Ω</text>
<line x1="420.0" y1="60.0" x2="420.0" y2="115.0" stroke="#111111" stroke-width="2.0" stroke-linecap="round"/>
<line x1="420.0" y1="155.0" x2="420.0" y2="210.0" stroke="#111111" stroke-width="2.0" stroke-linecap="round"/>
<rect x="-20.0" y="-7.5" width="40" height="15" fill="#fff" stroke="#111111" stroke-width="2.0" transform="translate(420.0,135.0) rotate(90.0)"/>
