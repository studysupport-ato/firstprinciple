<text x="120.0" y="39.0" font-size="15" text-anchor="middle" dominant-baseline="middle" fill="#111111"><tspan font-style="italic">R</tspan> = ?</text>
<polyline points="200.0,60.0 420.0,60.0" fill="none" stroke="#111111" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="40.0" cy="210.0" r="4.2" fill="#fff" stroke="#111111" stroke-width="2.0"/>
