<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" width="520" height="250" font-family="'Helvetica Neue',Arial,sans-serif" role="img" aria-label="20, 20 and 30 ohm resistors in parallel, in series with an unknown resistance">
<title>20, 20 and 30 ohm resistors in parallel, in series with an unknown resistance</title>
<rect width="520" height="250" fill="#ffffff"/>
<circle cx="40.0" cy="60.0" r="4.2" fill="#fff" stroke="#111111" stroke-width="2.0"/>
