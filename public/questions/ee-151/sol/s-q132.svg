<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" font-family="'Helvetica Neue',Arial,sans-serif" role="img" aria-label="Single-phase motor developing 5 kW on a 200 V, 50 Hz supply">
