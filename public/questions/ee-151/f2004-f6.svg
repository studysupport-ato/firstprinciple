<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" width="400" height="170" font-family="'Helvetica Neue',Arial,sans-serif" role="img" aria-label="A linear network with output terminals A and B (December 2004, Fig. 6)">
<title>A linear network with output terminals A and B (December 2004, Fig. 6)</title>
<rect width="400" height="170" fill="#ffffff"/>
<rect x="60" y="30" width="170" height="110" fill="#fff" stroke="#111111" stroke-width="2.0"/>
<text x="145.0" y="75.0" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#111111">Linear</text>
<text x="145.0" y="95.0" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#111111">network</text>
<polyline points="230.0,60.0 320.0,60.0" fill="none" stroke="#111111" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="320.0" cy="60.0" r="4.2" fill="#fff" stroke="#111111" stroke-width="2.0"/>
<text x="334.0" y="60.0" font-size="16" text-anchor="start" dominant-baseline="middle" fill="#111111" font-style="italic">A</text>
<polyline points="230.0,110.0 320.0,110.0" fill="none" stroke="#111111" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="320.0" cy="110.0" r="4.2" fill="#fff" stroke="#111111" stroke-width="2.0"/>
<text x="334.0" y="110.0" font-size="16" text-anchor="start" dominant-baseline="middle" fill="#111111" font-style="italic">B</text>
</svg>
