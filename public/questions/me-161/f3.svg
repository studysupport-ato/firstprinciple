<text x="280.0" y="384.0" font-family="Outfit, Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#1A1814" text-anchor="middle" dominant-baseline="middle">θx = 60°   θy = 45°   θz = 120°</text>
